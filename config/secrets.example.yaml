# DavyLinks 配置文件
# 复制此文件为 secrets.yaml 并填入实际值

# 飞书开放平台凭证
feishu:
  app_id: "cli_xxx"           # 替换为你的飞书 App ID
  app_secret: "xxx"            # 替换为你的飞书 App Secret
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxx"  # 替换为你的 Webhook URL
  bitable:
    app_token: "xxx"           # 多维表格 App Token
    table_id: "tblxxx"         # 多维表格 Table ID

# Obsidian 配置
obsidian:
  vault_path: "/Users/qiming/ObsidianWiki"

# LLM Provider 配置（示例）
llm_providers:
  qwen:
    api_key: "sk-xxx"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
  kimi:
    api_key: "xxx"
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-8k"
