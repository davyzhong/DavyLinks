# DavyLinks 配置文件
# 复制此文件为 secrets.yaml 并填入实际值
#
# 配置文件位置（按优先级）：
#   1. config/secrets.yaml     ← 推荐主位置（项目目录下）
#   2. ~/.davylinks/secrets.yaml  ← 备用位置
# 环境变量会覆盖此文件中的设置

# 飞书开放平台凭证
feishu:
  app_id: "cli_xxx"           # 替换为你的飞书 App ID
  app_secret: "xxx"            # 替换为你的飞书 App Secret
  webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxx"  # 群机器人 Webhook URL
  bitable:
    app_token: "xxx"           # 多维表格 App Token（从 URL 中获取）
    table_id: "tblxxx"         # 多维表格 Table ID
    # 表格字段结构：日期、标题、来源、来源列表、来源数量、分类、摘要、热度评分、是否多源交叉、链接

# Obsidian 配置
obsidian:
  vault_path: "/Users/qiming/ObsidianWiki"

# 可选：复用 Davybase 的通知脚本
davybase:
  notify_path: ""          # 例如 /path/to/davybase/scripts/notify.py
  secrets_path: ""         # 例如 /path/to/davybase/secrets.yaml

# LLM Provider 配置（示例）
llm_providers:
  qwen:
    api_key: "sk-xxx"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
  kimi:
    api_key: "xxx"
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-8k"
