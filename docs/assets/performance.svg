<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="920" height="400" rx="16" fill="#F8FAFC"/>
  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">性能 — 全管线端到端约 60 秒</text>

  <!-- 左：聚类对比 -->
  <text x="235" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">话题聚类耗时（100 篇）</text>
  <g>
    <!-- 优化前 -->
    <rect x="60" y="100" width="330" height="36" rx="6" fill="#FCA5A5"/>
    <text x="72" y="123" font-size="12" fill="#7F1D1D" font-weight="600">O(n²) 两两比较 — 1,200 ms</text>
    <!-- 优化后 (极短) -->
    <rect x="60" y="150" width="6" height="36" rx="3" fill="#34D399"/>
    <text x="78" y="173" font-size="12" fill="#065F46" font-weight="600">O(n) 倒排索引 — 0.5 ms</text>
    <rect x="240" y="150" width="150" height="36" rx="18" fill="#059669"/>
    <text x="315" y="173" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF">提速 2400×</text>
  </g>
  <text x="235" y="215" text-anchor="middle" font-size="11" fill="#64748B">比较次数 4,950 → 127（-95%）· 聚类质量不变</text>

  <!-- 分隔线 -->
  <line x1="460" y1="90" x2="460" y2="330" stroke="#E2E8F0" stroke-width="2"/>

  <!-- 右：LLM 并行 -->
  <text x="690" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">LLM 摘要耗时（TOP 5）</text>
  <g>
    <rect x="520" y="100" width="330" height="36" rx="6" fill="#FCA5A5"/>
    <text x="532" y="123" font-size="12" fill="#7F1D1D" font-weight="600">串行逐篇摘要 — 250 s</text>
    <rect x="520" y="150" width="66" height="36" rx="6" fill="#34D399"/>
    <text x="596" y="173" font-size="12" fill="#065F46" font-weight="600">4 路并行 — 50 s</text>
    <rect x="700" y="150" width="150" height="36" rx="18" fill="#059669"/>
    <text x="775" y="173" text-anchor="middle" font-size="13" font-weight="800" fill="#FFF">提速 5×</text>
  </g>
  <text x="690" y="215" text-anchor="middle" font-size="11" fill="#64748B">Qwen / Kimi / Zhipu / MiniMax Round-robin + fallback</text>

  <!-- 底部指标卡 -->
  <g font-size="12" fill="#334155">
    <rect x="60"  y="250" width="190" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="155" y="295" text-anchor="middle" font-size="26" font-weight="800" fill="#2563EB">~50 篇/秒</text>
    <text x="155" y="325" text-anchor="middle" fill="#64748B">RSS 扫描速度</text>

    <rect x="270" y="250" width="190" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="365" y="295" text-anchor="middle" font-size="26" font-weight="800" fill="#7C3AED">&lt; 1 ms</text>
    <text x="365" y="325" text-anchor="middle" fill="#64748B">聚类（100 篇）</text>

    <rect x="480" y="250" width="190" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="575" y="295" text-anchor="middle" font-size="26" font-weight="800" fill="#059669">~8 ms</text>
    <text x="575" y="325" text-anchor="middle" fill="#64748B">状态写入（100 条）</text>

    <rect x="690" y="250" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="775" y="295" text-anchor="middle" font-size="26" font-weight="800" fill="#D97706">&lt; 50 MB</text>
    <text x="775" y="325" text-anchor="middle" fill="#64748B">内存占用</text>
  </g>
</svg>
